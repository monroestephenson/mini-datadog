[package]
name = "mini-datadog-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", features = ["std"] }
futures = "0.3"
# Postgres
tokio-postgres = "0.7"
# Redis
redis = "0.21"
# Kafka (rdkafka)
rdkafka = "0.30"
# NATS
async-nats = "0.22"
# OpenTelemetry
opentelemetry = "0.17"
opentelemetry-otlp = "0.11"
# For encryption, e.g. using ring or any cryptography crate
ring = "0.16"
# WebSockets
tokio-tungstenite = "0.20"
# Slack or email integrations can be placeholders
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "json"] }
anyhow = "1.0"

[dev-dependencies]