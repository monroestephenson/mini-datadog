[package]
name = "mini-datadog"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6"
tokio = { version = "1.20", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
hyper = "0.14"
# Postgres
tokio-postgres = "0.7"
# Redis
redis = "0.21"
# Kafka (rdkafka)
rdkafka = "0.30"
# NATS
async-nats = "0.22"
# OpenTelemetry
opentelemetry = "0.17"
opentelemetry-otlp = "0.11"
# For encryption, e.g. using ring or any cryptography crate
ring = "0.16"
# WebSockets
tokio-tungstenite = "0.17"
# Slack or email integrations can be placeholders

[dev-dependencies]