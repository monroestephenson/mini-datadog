apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-datadog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-datadog
  template:
    metadata:
      labels:
        app: mini-datadog
    spec:
      containers:
        - name: backend
          image: mini-datadog-backend:latest
          ports:
            - containerPort: 8080
        - name: frontend
          image: mini-datadog-frontend:latest
          ports:
            - containerPort: 3000